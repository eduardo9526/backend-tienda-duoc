spring.application.name=backend-tienda
server.port=8080

# Base de datos H2 persistente en archivo
spring.datasource.url=jdbc:h2:file:./data/tiendadb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Clave secreta JWT (mínimo 32 caracteres) y expiración (24 horas en ms)
jwt.secret=ClaveSecretaSuperSeguraParaEvaluacionDuoc2026!
jwt.expiration=86400000